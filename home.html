<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    *{
        box-sizing: border-box;
        padding: 0;
        margin: 0;
        list-style: none;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    }
    body, html{
        background-color: rgb(11, 11, 11);
       min-width: 100vh;
    }
    .hero{
        min-height: 100vh;
        background-color: rgb(6, 6, 6);
        background: url('/phototsvic.JPG') no-repeat ;
        background-size: cover;
        background-position: center;
        backdrop-filter: blur(200%);
        position: relative;
        background-attachment: fixed;
    }
    .hero .lnt nav{
        position:absolute ;
        top: 0;
        right: 0;
        width: 70%;
        padding: 10px 25px;
        display: flex ;
        align-items: center;
        justify-content: space-between;
        scroll-behavior: smooth;
        
    }
    nav ul{
        display: flex;
        text-decoration: none;
        background-color: white;
        padding: 10px 25px;
        margin-bottom: 20px;
        border-radius: 1em;
        gap: 2rem;
        text-transform: capitalize;
    }
    nav ul a{
        text-decoration: none;
        font-size: 1em;
        font-weight: bold;
        color: black;
    }
    nav ul a:hover{
        border-block-end:2px solid black;
    }
    nav button{
        padding: 8px 25px;
        background:white;
        color: black;
        font-weight: bold;
         border-radius: .8rem;
         margin-right: 10px;
         border: none;
         cursor: pointer;
    }
    nav button:nth-child(2){
     background-color: grey;
     color: white;
    }
    nav button:hover{
        box-shadow: inset 0 0 10px grey;
        color: blue;
        text-rendering: inherit;
    }
    .content{
        position: absolute;
        top: 50%;
        left: 50%;
        transform:translate(-50%, -50%);
        text-align: center;
        width: 500px;
        
    }
    .content img{
        width: 250px;
        height: 250px;
        border-radius: 50%;
        border: 2px solid cyan;
        box-shadow: 0 0 20px #4ecdc4, 0 0 40px #349090;
        animation: glow 1.5s  infinite alternate;
        transition: all .5s ease-in-out;
       
    } 
    .content img:hover{
        transform: scale(1.1);
    }
    @keyframes glow {
        
       from{
        box-shadow: 0 0 30px rgb(123, 240, 240), 0 0  50px cyan;
       }
    
    }
    .content h1{
        font-size: 3rem;
        color: whitesmoke;
    }
    .content p{
        font-size: 1em;
        color: white;
        font-weight: bold;
    }
    </style>
</head>
<body>
    <section class="hero">
    <div class="lnt">
    <nav>
        <ul>
       <li><a href="www.google.com">about</a></li> 
        <li><a href="">home</a></li>
       <li> <a href="">service</a></li>
       <li> <a href="">contact</a></li>
       <li> <a href="">help</a></li>
    </ul>
    <div class="btn">
        <button>sign in</button>
        <button>sign out</button>
    </div>
    </nav>
</div>
<div class="content">
    <img src="photots/biru.JPG" alt="">
    <h1>Let`s gather</h1>
    <p>Explore the world of possibilities</p>
</div>
</section>

</body>
</html>
